<style>
:root{
  --bg:#f7f8fc; --card:#fff; --ink:#18202b; --muted:#697386; --line:#e5e8f0;
  --accent:#5b5bd6; --accent2:#8b5cf6; --ok:#198754; --bad:#c93737; --warn:#a86200;
  --shadow:0 12px 32px rgba(35,39,47,.10); --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.55;padding-bottom:104px}
button,input,select{font:inherit}
button{touch-action:manipulation}
.top{position:sticky;top:0;z-index:20;background:rgba(247,248,252,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 14px 10px}
.brand{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;font-size:26px;box-shadow:var(--shadow)}
.brand h1{font-size:22px;margin:0}.brand small{display:block;color:var(--muted);font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#eff0ff,#f7edff);border:1px solid #e2dcff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero h2{margin:0 0 6px;font-size:24px}.hero p{margin:4px 0;color:#4f5870}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{padding:6px 10px;border-radius:999px;background:white;border:1px solid var(--line);font-size:14px}
.voicebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.voicebar button,.smallbtn{border:0;border-radius:14px;padding:10px 13px;background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(40,40,80,.08);font-weight:700}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2))!important;color:white!important}
.modebar{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.modebar::-webkit-scrollbar{display:none}
.modebtn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;color:#4d566b}.modebtn.active{background:#22264c;color:white;border-color:#22264c}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.flash{min-height:430px;cursor:pointer;position:relative;overflow:hidden}
.flash .front,.flash .back{transition:.18s ease}.flash:not(.revealed) .back{display:none}.flash.revealed .front-hint{display:none}
.wordline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bigword{font-size:34px;font-weight:850;letter-spacing:.2px}.emoji{font-size:46px}
.speak{border:0;background:#f0f2ff;border-radius:50%;width:46px;height:46px;font-size:22px;display:inline-grid;place-items:center}
.label{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.ibox{border:1px solid var(--line);background:#fafbff;border-radius:16px;padding:12px}.ibox b{display:block;margin-bottom:3px}
.memory{background:#fff9df;border:1px solid #f2dd8e;border-radius:16px;padding:14px;margin-top:12px}.grammar{background:#eef8ff;border:1px solid #c9e7ff;border-radius:16px;padding:14px;margin-top:12px}
.example{background:#f5f7fb;border-radius:16px;padding:14px;margin-top:12px}.example .de{font-size:20px;font-weight:700}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.controls button{flex:1;min-width:120px;border:0;border-radius:16px;padding:13px;font-weight:800;background:#eef0f7}
.quiz-title{font-size:16px;color:var(--muted);margin-bottom:8px}.question{font-size:30px;font-weight:850;margin:8px 0 18px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:1px solid var(--line);background:white;border-radius:16px;padding:14px;text-align:left;font-weight:700;min-height:62px}.option.correct{border-color:#72c598;background:#eefbf4}.option.wrong{border-color:#ef9a9a;background:#fff0f0}
.feedback{min-height:34px;margin-top:12px;font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.inputrow{display:flex;gap:8px}.answerinput{flex:1;border:2px solid #dfe3ec;border-radius:16px;padding:14px 15px;font-size:20px;min-width:0}.checkbtn{border:0;border-radius:16px;padding:12px 16px;background:#23274d;color:white;font-weight:800}
.listenbox{display:grid;place-items:center;padding:20px}.listenbig{width:100px;height:100px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:42px;box-shadow:var(--shadow)}
.list{display:grid;gap:10px}.vocabitem{background:white;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:center}.vocabitem .grow{flex:1}.vocabitem b{font-size:20px}.danger{background:#fff0f0!important;color:#a52a2a!important}
.empty{text-align:center;color:var(--muted);padding:38px 10px}
.legend{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
.filterrow{display:flex;gap:8px;margin-bottom:12px}.filterrow select{border:1px solid var(--line);border-radius:14px;padding:10px;background:white}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.bottom-inner{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;background:transparent;border-radius:14px;padding:7px 2px;font-size:12px;color:#596174}.navbtn span{display:block;font-size:23px;line-height:1.1}.navbtn.active{background:#eff0ff;color:#3737a3;font-weight:800}
abbr{text-decoration:none;border-bottom:1px dotted}
@media(max-width:700px){
 body{font-size:17px}.hero-grid{grid-template-columns:1fr}.bigword{font-size:29px}.emoji{font-size:38px}.info-grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.flash{min-height:450px}main{padding:12px}.brand h1{font-size:19px}
}
</style>
</head>

 ist ein Wort für „草莓蛋糕“.", "definitionZh": "der Erdbeerkuchen 是表示“草莓蛋糕”的名词。", "tip": "Kuchen 是 der → 草莓只是口味，真正决定冠词的是 der Kuchen。", "grammar": "陈述句基础语序：主语通常在前，变位动词保持第二位；时间、地点等成分可以移动，但动词第二位不变。"}, {"id": 170, "unit": 8, "display": "der Käsekuchen", "pos": "名词", "gender": "der", "plural": "die Käsekuchen", "forms": "Sg.: der Käsekuchen; Pl.: die Käsekuchen", "zh": "奶酪蛋糕", "example": "Meine Oma backt den besten Käsekuchen.", "exampleZh": "我奶奶烤的奶酪蛋糕最好吃。", "lemma": "Käsekuchen", "emoji": "🍰", "definition": "Der Käsekuchen ist ein Wort für „奶酪蛋糕“.", "definitionZh": "der Käsekuchen 是表示“奶酪蛋糕”的名词。", "tip": "Kuchen 是 der → 奶酪只是前半部分，后面的 Kuchen 决定 der。", "grammar": "陈述句基础语序：主语通常在前，变位动词保持第二位；时间、地点等成分可以移动，但动词第二位不变。"}, {"id": 171, "unit": 8, "display": "die Masterarbeit", "pos": "名词", "gender": "die", "plural": "die Masterarbeiten", "forms": "Sg.: die Masterarbeit; Pl.: die Masterarbeiten", "zh": "硕士论文", "example": "Ich muss in vier Wochen meine Masterarbeit abgeben.", "exampleZh": "我必须在四周后提交硕士论文。", "lemma": "Masterarbeit", "emoji": "🎓", "definition": "Die Masterarbeit ist ein Wort für „硕士论文“.", "definitionZh": "die Masterarbeit 是表示“硕士论文”的名词。", "tip": "Arbeit 是 die → 最后的 Arbeit 决定 die。", "grammar": "陈述句基础语序：主语通常在前，变位动词保持第二位；时间、地点等成分可以移动，但动词第二位不变。"}, {"id": 172, "unit": 8, "display": "allerdings", "pos": "副词", "gender": "", "plural": "", "forms": "", "zh": "不过；然而；确实", "example": "Das ist allerdings schwierig, dass du morgen nicht kommen kannst.", "exampleZh": "不过你明天不能来，这确实有点困难。", "lemma": "allerdings", "emoji": "💡", "definition": "allerdings bedeutet ungefähr „不过“.", "definitionZh": "allerdings 大致表示“不过”。", "tip": "拼写钩子：圈出 allerdings 里最容易写错的字母，默写时先写这一小段，再补全整词。", "grammar": "完成时/复合谓语：haben/sein（或其他助动词）占第二位，过去分词或主要谓语成分通常靠句末。"}];
const ABBR = `Sg. = Singular 单数 · Pl. = Plural 复数 · Prät. = Präteritum 过去时 · Perfekt = 完成时`;
let mode="flash", current=null, score=+localStorage.getItem("u78_right")||0, streak=0;
const wrongSet=new Set(JSON.parse(localStorage.getItem("u78_wrong")||"[]"));
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
$("#totalCount").textContent=WORDS.length; $("#rightCount").textContent=score; updateWrong();

function filtered(extra=()=>true){
 const u=$("#unitFilter").value;
 return WORDS.filter(w=>(u==="all"||String(w.unit)===u)&&extra(w));
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function escapeHTML(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function markWrong(w){wrongSet.add(w.id);localStorage.setItem("u78_wrong",JSON.stringify([...wrongSet]));updateWrong()}
function markRight(){score++;streak++;localStorage.setItem("u78_right",score);$("#rightCount").textContent=score;$("#streak").textContent=streak}
function fail(){streak=0;$("#streak").textContent=streak}
function updateWrong(){$("#wrongCount").textContent=wrongSet.size}
function speechText(w,kind){
 if(kind==="plural") return w.plural||w.display;
 if(kind==="def") return w.definition;
 if(kind==="example") return w.example;
 return w.display;
}

let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()}
if("speechSynthesis" in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices}
function bestGermanVoice(){
 const de=voices.filter(v=>/^de([-_]|$)/i.test(v.lang)||/german|deutsch/i.test(v.name));
 const prefs=["Katja","Conrad","Google Deutsch","German Germany","Natural","Anna"];
 de.sort((a,b)=>{
   const score=v=>prefs.reduce((n,p,i)=>n+(v.name.toLowerCase().includes(p.toLowerCase())?(100-i*8):0),0)+(v.lang==="de-DE"?40:0);
   return score(b)-score(a)
 });
 return de[0]||voices.find(v=>/^de/i.test(v.lang))||null;
}
function speak(text, ev){
 if(ev){ev.preventDefault();ev.stopPropagation()}
 if(!("speechSynthesis" in window)) return alert("此浏览器不支持系统语音。");
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.rate=.86;
 const v=bestGermanVoice(); if(v)u.voice=v; speechSynthesis.speak(u);
}
$("#unlockVoice").onclick=e=>{loadVoices();speak("Guten Tag! Wir lernen heute Deutsch.",e)}
$("#testVoice").onclick=e=>speak("Das ist ein Test für die deutsche Aussprache.",e)

function switchMode(m){
 mode=m; $$(".panel").forEach(x=>x.classList.toggle("active",x.id===m));
 $$(".modebtn,.navbtn").forEach(x=>x.classList.toggle("active",x.dataset.mode===m));
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
$$("[data-mode]").forEach(b=>b.addEventListener("click",()=>switchMode(b.dataset.mode)));
$("#unitFilter").onchange=render; $("#shuffleBtn").onclick=render;

function speakBtn(text,label="🔊"){
 return `<button class="speak" aria-label="发音" data-speak="${escapeHTML(text)}">${label}</button>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-speak]"); if(b)speak(b.dataset.speak,e);
});

function flashCard(){
 let arr=filtered(); if(!arr.length)return;
 current=pick(arr); const w=current;
 $("#flash").innerHTML=`<div class="card flash" id="flashcard">
 <div class="front">
  <div class="label">UNIT ${w.unit} · ${w.pos}</div>
  <div class="wordline"><span class="emoji">${w.emoji}</span><span class="bigword">${escapeHTML(w.display)}</span>${speakBtn(w.display)}</div>
  <p class="front-hint" style="color:var(--muted)">点卡片翻面 / 显示答案。点喇叭只发音，不会翻面。</p>
 </div>
 <div class="back">
   <div class="info-grid">
    <div class="ibox"><b>中文</b>${escapeHTML(w.zh)}</div>
    <div class="ibox"><b>词性 / 形式</b>${escapeHTML(w.pos)}${w.forms?`<br>${escapeHTML(w.forms)}`:""}</div>
    ${w.gender?`<div class="ibox"><b>冠词</b>${escapeHTML(w.gender)}</div>`:""}
    ${w.plural?`<div class="ibox"><b>复数 ${speakBtn(w.plural)}</b>${escapeHTML(w.plural)}</div>`:""}
   </div>
   <div class="example"><div class="label">简单德语解释 ${speakBtn(w.definition)}</div><div class="de">${escapeHTML(w.definition)}</div><div>${escapeHTML(w.definitionZh)}</div></div>
   <div class="memory"><b>🧠 记忆方法</b><br>${w.tip}</div>
   <div class="example"><div class="label">例句 ${speakBtn(w.example)}</div><div class="de">${escapeHTML(w.example)}</div><div>${escapeHTML(w.exampleZh)}</div></div>
   <div class="grammar"><b>🧱 语序提示</b><br>${escapeHTML(w.grammar)}</div>
   <div class="legend">${ABBR}</div>
 </div>
 <div class="controls"><button id="reveal">${"显示 / 隐藏答案"}</button><button id="wrongAdd">📕 加入生词本</button><button id="nextFlash" class="primary">下一张 →</button></div>
 </div>`;
 const card=$("#flashcard");
 card.addEventListener("click",e=>{if(e.target.closest("button"))return;card.classList.toggle("revealed")});
 $("#reveal").onclick=e=>{e.stopPropagation();card.classList.toggle("revealed")};
 $("#wrongAdd").onclick=e=>{e.stopPropagation();markWrong(w);e.currentTarget.textContent="✅ 已加入"};
 $("#nextFlash").onclick=e=>{e.stopPropagation();flashCard()};
}

function meaningGame(){
 const arr=filtered(); const w=pick(arr); current=w;
 let opts=[w,...arr.filter(x=>x.id!==w.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 $("#meaning").innerHTML=`<div class="card"><div class="quiz-title">请选择正确中文意思</div><div class="question">${w.emoji} ${escapeHTML(w.display)} ${speakBtn(w.display)}</div>
 <div class="options">${opts.map(o=>`<button class="option" data-id="${o.id}">${escapeHTML(o.zh)}</button>`).join("")}</div><div class="feedback" id="fb"></div></div>`;
 $$("#meaning .option").forEach(b=>b.onclick=()=>{const ok=+b.dataset.id===w.id;b.classList.add(ok?"correct":"wrong");$("#fb").innerHTML=ok?`<span class="ok">✓ 正确！</span>`:`<span class="bad">✗ 正确答案：${escapeHTML(w.zh)}</span>`; if(ok)markRight();else{fail();markWrong(w)}; setTimeout(meaningGame,900)});
}

function articleGame(){
 const arr=filtered(w=>["der","die","das"].includes(w.gender)); if(!arr.length){$("#article").innerHTML='<div class="card empty">当前范围没有可练习的冠词。</div>';return}
 const w=pick(arr); current=w;
 $("#article").innerHTML=`<div class="card"><div class="quiz-title">选出正确冠词</div><div class="question">${w.emoji} ${escapeHTML(w.lemma)}</div><div class="options">
 ${["der","die","das"].map(a=>`<button class="option" data-a="${a}">${a}</button>`).join("")}</div><div class="feedback" id="fb"></div><div class="memory" style="margin-top:18px"><b>提示将在作答后出现</b></div></div>`;
 $$("#article .option").forEach(b=>b.onclick=()=>{let ok=b.dataset.a===w.gender;b.classList.add(ok?"correct":"wrong");$("#article .memory").innerHTML="<b>🧠 记忆：</b><br>"+w.tip;$("#fb").innerHTML=ok?`<span class="ok">✓ ${w.gender} ${escapeHTML(w.lemma)}</span>`:`<span class="bad">✗ 正确是 ${w.gender} ${escapeHTML(w.lemma)}</span>`; if(ok)markRight();else{fail();markWrong(w)};setTimeout(articleGame,1200)});
}

function pluralGame(){
 const arr=filtered(w=>w.plural); if(!arr.length){$("#plural").innerHTML='<div class="card empty">当前范围没有复数项目。</div>';return}
 const w=pick(arr); current=w;
 $("#plural").innerHTML=`<div class="card"><div class="quiz-title">写出复数（可以写完整形式，例如 die Häuser）</div><div class="question">${w.emoji} ${escapeHTML(w.display)} ${speakBtn(w.display)}</div>
 <div class="inputrow"><input class="answerinput" id="pluralInput" autocomplete="off" autocapitalize="none" placeholder="输入复数…"><button class="checkbtn" id="checkPlural">检查</button></div>
 <div class="feedback" id="fb"></div><div class="controls"><button data-speak="${escapeHTML(w.plural)}">🔊 复数发音</button></div></div>`;
 $("#checkPlural").onclick=()=>checkTyped($("#pluralInput").value,w.plural,w,"plural");
 $("#pluralInput").onkeydown=e=>{if(e.key==="Enter")$("#checkPlural").click()};
}

function perfektGame(){
 const arr=filtered(w=>w.pos.includes("动词") && /Perfekt:/.test(w.forms)); if(!arr.length){$("#perfekt").innerHTML='<div class="card empty">当前范围没有完成时项目。</div>';return}
 const w=pick(arr); current=w; const ans=w.forms.split("Perfekt:")[1].trim();
 $("#perfekt").innerHTML=`<div class="card"><div class="quiz-title">完成时挑战：写出 Perfekt（含 er + 助动词）</div><div class="question">${escapeHTML(w.lemma)} ${speakBtn(w.display)}</div>
 <div class="ibox" style="margin-bottom:12px"><b>第三人称单数提示</b>${escapeHTML(w.forms.split(";")[0])}</div>
 <div class="inputrow"><input class="answerinput" id="perfInput" autocomplete="off" autocapitalize="none" placeholder="例如：er hat …"><button class="checkbtn" id="checkPerf">检查</button></div><div class="feedback" id="fb"></div></div>`;
 $("#checkPerf").onclick=()=>checkTyped($("#perfInput").value,ans,w,"perfekt");
 $("#perfInput").onkeydown=e=>{if(e.key==="Enter")$("#checkPerf").click()};
}

function dictationGame(){
 const arr=filtered(w=>w.lemma && !w.display.includes("...")); const w=pick(arr); current=w;
 $("#dictation").innerHTML=`<div class="card"><div class="quiz-title">听音默写：播放德语，输入你听到的词（名词建议连冠词一起写）</div>
 <div class="listenbox"><button class="listenbig" id="listenWord">🔊</button><div style="color:var(--muted);margin-top:10px">可以重复播放</div></div>
 <div class="inputrow"><input class="answerinput" id="dictInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入听到的德语…"><button class="checkbtn" id="checkDict">检查</button></div><div class="feedback" id="fb"></div></div>`;
 $("#listenWord").onclick=e=>speak(w.display,e); $("#checkDict").onclick=()=>checkTyped($("#dictInput").value,w.display,w,"dictation");
 $("#dictInput").onkeydown=e=>{if(e.key==="Enter")$("#checkDict").click()};
}

function normalizeBasic(s){return s.trim().replace(/\s+/g," ")}
function stripDiacritics(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ß/g,"ss").replace(/ẞ/g,"SS")}
function checkTyped(input,target,w,kind){
 const fb=$("#fb"); const a=normalizeBasic(input), t=normalizeBasic(target);
 let status="";
 if(a===t) status="exact";
 else if(a.toLocaleLowerCase("de-DE")===t.toLocaleLowerCase("de-DE")) status="case";
 else if(stripDiacritics(a).toLocaleLowerCase("de-DE")===stripDiacritics(t).toLocaleLowerCase("de-DE")) status="umlaut";
 else status="spell";
 if(status==="exact"){fb.innerHTML=`<span class="ok">✓ 完全正确！</span>`;markRight()}
 else if(status==="case"){fb.innerHTML=`<span class="warn">△ 单词基本正确，但大小写有误。正确：${escapeHTML(target)}</span>`;fail();markWrong(w)}
 else if(status==="umlaut"){fb.innerHTML=`<span class="warn">△ 注意变音符号/ß：正确是 ${escapeHTML(target)}</span>`;fail();markWrong(w)}
 else{fb.innerHTML=`<span class="bad">✗ 拼写错误。正确：${escapeHTML(target)}</span>`;fail();markWrong(w)}
 setTimeout(()=>{ if(kind==="plural")pluralGame(); if(kind==="perfekt")perfektGame(); if(kind==="dictation")dictationGame()},1500);
}

function sentenceGame(){
 const arr=filtered(); const w=pick(arr); current=w;
 const words=w.example.replace(/[„“"!?.]/g,"").split(/\s+/);
 let shuffled=[...words].sort(()=>Math.random()-.5);
 $("#sentence").innerHTML=`<div class="card"><div class="quiz-title">例句与语序：先读句子，再看语序说明</div>
 <div class="wordline"><span class="emoji">${w.emoji}</span><span class="bigword">${escapeHTML(w.display)}</span>${speakBtn(w.display)}</div>
 <div class="example"><div class="label">课本例句 ${speakBtn(w.example)}</div><div class="de">${escapeHTML(w.example)}</div><div>${escapeHTML(w.exampleZh)}</div></div>
 <div class="grammar"><b>🧱 语序</b><br>${escapeHTML(w.grammar)}</div>
 <div class="ibox" style="margin-top:12px"><b>乱序观察（找动词位置）</b>${shuffled.map(x=>`<span class="pill" style="display:inline-block;margin:4px">${escapeHTML(x)}</span>`).join("")}</div>
 <div class="legend">重点：陈述句 = 变位动词第二位；疑问句 = 动词第一位 / 疑问词 + 动词第二位；完成时 = haben/sein 第二位 + 过去分词句末；可分动词 = 前缀句末；情态动词 = 情态动词第二位 + 原形句末；dass 从句 = 动词句末。</div>
 </div>`;
}

function wrongBook(){
 const arr=WORDS.filter(w=>wrongSet.has(w.id));
 $("#wrong").innerHTML=`<div class="card"><div class="wordline"><div><div class="label">本机生词本</div><div class="bigword">📕 ${arr.length} 个词</div></div></div>
 <p style="color:var(--muted)">答错的词会自动加入。数据保存在当前浏览器的 localStorage 中。</p>
 <div class="controls"><button id="practiceWrong" class="primary">只练生词</button><button id="clearWrong" class="danger">清空生词本</button></div></div>
 <div class="list">${arr.length?arr.map(w=>`<div class="vocabitem"><div style="font-size:30px">${w.emoji}</div><div class="grow"><b>${escapeHTML(w.display)}</b><div>${escapeHTML(w.zh)}</div><small>${escapeHTML(w.forms||w.pos)}</small></div>${speakBtn(w.display)}<button class="smallbtn" data-remove="${w.id}">移除</button></div>`).join(""):`<div class="card empty">还没有生词。继续练习，答错的词会自动出现在这里。</div>`}</div>`;
 $("#clearWrong").onclick=()=>{if(confirm("确定清空生词本吗？")){wrongSet.clear();localStorage.removeItem("u78_wrong");updateWrong();wrongBook()}};
 $("#practiceWrong").onclick=()=>{if(!arr.length)return alert("生词本还是空的。"); current=pick(arr); switchMode("flash"); renderFlashFrom(current)};
 $$("[data-remove]").forEach(b=>b.onclick=()=>{wrongSet.delete(+b.dataset.remove);localStorage.setItem("u78_wrong",JSON.stringify([...wrongSet]));updateWrong();wrongBook()});
}
function renderFlashFrom(w){
 current=w; $("#flash").innerHTML=""; flashCard();
}

function render(){
 if(mode==="flash")flashCard();
 else if(mode==="meaning")meaningGame();
 else if(mode==="article")articleGame();
 else if(mode==="plural")pluralGame();
 else if(mode==="perfekt")perfektGame();
 else if(mode==="dictation")dictationGame();
 else if(mode==="sentence")sentenceGame();
 else if(mode==="wrong")wrongBook();
}
render();
</script>
</body>
</html>
