<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 8 德语默写训练</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--t:#202124;--m:#6b7280;--line:#e5e7eb;--p:#5755d9;--ok:#12805c;--bad:#b93c2f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--t)}
.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.hero{background:linear-gradient(135deg,#fff,#f0efff)}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.sub,.muted{color:var(--m);line-height:1.65}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
button,input{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}.btn.primary,.btn.active{background:var(--p);color:#fff;border-color:var(--p)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.mode{font-weight:800;color:var(--p)}.prompt{font-size:clamp(27px,6vw,42px);font-weight:850;line-height:1.35;margin:26px 0 10px}
.answer{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 15px;font-size:20px}.special{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.special .btn{min-width:44px;padding:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions .btn{flex:1;min-width:115px}.feedback{min-height:34px;margin-top:12px;font-weight:750}.ok{color:var(--ok)}.bad{color:var(--bad)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;min-height:62px;text-align:left;cursor:pointer}.choice.good{border-color:var(--ok);background:#ebfaf4}.choice.no{border-color:var(--bad);background:#fff0ee}
.round{width:46px;height:46px;border-radius:50%;border:0;background:#f0efff;font-size:21px;cursor:pointer}.wrong{display:none;margin-top:14px}.wrong.show{display:block}.wrongItem{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px}.wrongItem b{font-size:18px}.progress{height:8px;background:#eceef4;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:var(--p);width:0}
@media(max-width:700px){.tabs{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section class="hero"><h1>Unit 8 德语默写训练</h1><div class="sub">四种模式：看中文写德文｜看德文写中文｜看中文选德文｜看德文选中文。答错自动进入错题集，错题连续答对 2 次自动移除。德语可点 🔊 听发音，也可用 🎤 尝试语音输入。</div><div class="progress"><div id="bar" class="bar"></div></div></section>
<div class="tabs">
<button class="btn active" data-m="zw" onclick="setMode(this)">中→德 默写</button><button class="btn" data-m="dw" onclick="setMode(this)">德→中 默写</button>
<button class="btn" data-m="zc" onclick="setMode(this)">中→德 选择</button><button class="btn" data-m="dc" onclick="setMode(this)">德→中 选择</button>
<button class="btn" onclick="toggleWrong()">错题集 <span id="wc">0</span></button></div>
<section class="panel"><div class="top"><span id="mt" class="mode">看中文写德文</span><span class="grow"></span><span id="stat" class="muted"></span><button class="round" onclick="speakNow()" title="德语发音">🔊</button><button class="round" onclick="mic()" title="语音输入">🎤</button></div>
<div id="prompt" class="prompt"></div><div id="hint" class="muted"></div>
<div id="write"><input id="ans" class="answer" placeholder="输入答案，按 Enter 检查" onkeydown="if(event.key==='Enter')checkWrite()">
<div class="special"><button class="btn" onclick="ch('ä')">ä</button><button class="btn" onclick="ch('ö')">ö</button><button class="btn" onclick="ch('ü')">ü</button><button class="btn" onclick="ch('ß')">ß</button><button class="btn" onclick="ch('Ä')">Ä</button><button class="btn" onclick="ch('Ö')">Ö</button><button class="btn" onclick="ch('Ü')">Ü</button></div>
<div class="actions"><button class="btn primary" onclick="checkWrite()">检查</button><button class="btn" onclick="showAns()">看答案</button><button class="btn" onclick="nextQ()">下一题</button></div></div>
<div id="choice" style="display:none"><div id="choices" class="choices"></div><div class="actions"><button class="btn" onclick="nextQ()">下一题</button></div></div>
<div id="fb" class="feedback"></div></section>
<section id="wrong" class="panel wrong"><div class="top"><h2 style="margin:0">错题集</h2><span class="grow"></span><button class="btn" onclick="clearWrong()">清空</button></div><div class="muted">答错或看答案会自动加入；连续答对 2 次后自动移除。</div><div id="wl"></div></section>
</div><script>
const DATA=[{"de": "die Arbeitsstelle", "zh": "工作岗位"}, {"de": "die Stellenanzeige", "zh": "招聘广告"}, {"de": "das Vorstellungsgespräch", "zh": "求职面试"}, {"de": "das Protokoll", "zh": "记录；会议记录"}, {"de": "der Konflikt", "zh": "冲突；矛盾"}, {"de": "motiviert", "zh": "积极的；有动力的"}, {"de": "die Möbelmanufaktur", "zh": "家具制造厂"}, {"de": "unbefristet", "zh": "无固定期限的"}, {"de": "das Gehalt", "zh": "薪水；工资"}, {"de": "das Plus", "zh": "好处；优点"}, {"de": "der/die Werkstudent/in", "zh": "工读大学生"}, {"de": "die Personalabteilung", "zh": "人事部门"}, {"de": "die Elektrotechnik", "zh": "电气工程学"}, {"de": "abschließen", "zh": "结束；完成"}, {"de": "die Forschung", "zh": "研究"}, {"de": "die Entwicklung", "zh": "研制；发展"}, {"de": "die E-Mobilität", "zh": "电动出行；电动汽车"}, {"de": "die Technologie", "zh": "技术；工艺"}, {"de": "verbessern", "zh": "改善；改进"}, {"de": "der/die Arbeitgeber/in", "zh": "雇主"}, {"de": "der Kampf", "zh": "斗争；战斗"}, {"de": "der Bedarf", "zh": "需求"}, {"de": "die Fachkraft", "zh": "专业人员"}, {"de": "die Branche", "zh": "行业；部门"}, {"de": "tatsächlich", "zh": "确实；事实上"}, {"de": "der/die Bewerber/in", "zh": "申请人；求职者"}, {"de": "das Handwerk", "zh": "手工业"}, {"de": "qualifiziert", "zh": "有资格的；合格的"}, {"de": "der/die Berufseinsteiger/in", "zh": "职场新人"}, {"de": "die Wahl", "zh": "选择"}, {"de": "der Arbeitsmarkt", "zh": "劳动力市场"}, {"de": "einteilen", "zh": "划分；安排"}, {"de": "die Überstunde", "zh": "加班"}, {"de": "problemlos", "zh": "没有问题的；顺利的"}, {"de": "hauptsächlich", "zh": "主要地"}, {"de": "das Netzwerk", "zh": "网络"}, {"de": "ansprechen", "zh": "和人沟通；搭话"}, {"de": "zunächst", "zh": "首先"}, {"de": "erreichbar", "zh": "能联系到的"}, {"de": "definitiv", "zh": "肯定地；确定的"}, {"de": "umgehen (mit)", "zh": "对待；处理"}, {"de": "die Qualifikation", "zh": "资格；能力"}, {"de": "die Leistung", "zh": "成绩；绩效"}, {"de": "die Vollzeit", "zh": "全职"}, {"de": "der/die Systemadministrator/in", "zh": "系统管理员"}, {"de": "die Infrastruktur", "zh": "基础设施"}, {"de": "die Kommunikationsfähigkeit", "zh": "交际能力"}, {"de": "die Flexibilität", "zh": "灵活性"}, {"de": "das Weiterbildungsangebot", "zh": "继续教育机会"}, {"de": "das Jobticket", "zh": "工作票；通勤票"}, {"de": "der/die Beschäftigte", "zh": "雇员；员工"}, {"de": "das Inland", "zh": "本国；国内"}, {"de": "die Marke", "zh": "品牌"}, {"de": "der/die Produktmanager/in", "zh": "产品经理"}, {"de": "die Beobachtung", "zh": "观察"}, {"de": "die Analyse", "zh": "分析"}, {"de": "der Markttrend", "zh": "市场趋势"}, {"de": "interkulturell", "zh": "跨文化的"}, {"de": "das Bewerbungsgespräch", "zh": "工作面试；应聘面试"}, {"de": "der/die Teamleiter/in", "zh": "团队负责人"}, {"de": "die Wirtschaft", "zh": "经济"}, {"de": "die Unterrichtssprache", "zh": "授课语言"}, {"de": "das Marketingkonzept", "zh": "营销理念"}, {"de": "vermarkten", "zh": "销售；营销"}, {"de": "nachdem", "zh": "在……之后"}, {"de": "die Selbstpräsentation", "zh": "自我介绍；自我展示"}, {"de": "der Zeitdruck", "zh": "时间压力"}, {"de": "die Teamsitzung", "zh": "团队会议"}, {"de": "die Tagesordnung", "zh": "日程安排"}, {"de": "vegan", "zh": "纯素的"}, {"de": "entweder ... oder ...", "zh": "要么……要么……"}, {"de": "die Werbeaktion", "zh": "广告宣传活动"}, {"de": "der/die Influencer/in", "zh": "有影响力的人；网红"}, {"de": "zurückschicken", "zh": "寄回；退回"}, {"de": "das Ergebnisprotokoll", "zh": "会议结果记录"}, {"de": "die Sitzungsleitung", "zh": "会议主持"}, {"de": "der Tagesordnungspunkt", "zh": "议程事项"}, {"de": "abwesend", "zh": "不在场；缺席"}, {"de": "der Ärger", "zh": "生气；恼火"}, {"de": "sich aufregen", "zh": "发怒；生气"}, {"de": "die Absicht", "zh": "意图"}, {"de": "die Verzeihung", "zh": "原谅；抱歉"}, {"de": "das Verständnis", "zh": "理解"}, {"de": "das Missverständnis", "zh": "误解"}, {"de": "bemerken", "zh": "发觉；注意到"}, {"de": "der Vorwurf", "zh": "责备；指责"}, {"de": "die Viertelstunde", "zh": "一刻钟"}, {"de": "unordentlich", "zh": "不整洁的"}, {"de": "aufmerksam", "zh": "注意的；聚精会神的"}, {"de": "unklar", "zh": "不清楚的"}, {"de": "ignorieren", "zh": "忽视；无视"}, {"de": "der Erdbeerkuchen", "zh": "草莓蛋糕"}, {"de": "der Käsekuchen", "zh": "奶酪蛋糕"}, {"de": "die Masterarbeit", "zh": "硕士论文"}, {"de": "allerdings", "zh": "然而；不过"}],KEY='u8_dict_v1';let S=JSON.parse(localStorage.getItem(KEY)||'{"wrong":{},"done":0,"ok":0}'),mode='zw',cur=0,locked=false;
const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(S));upd()}
function upd(){$('wc').textContent=Object.keys(S.wrong||{}).length;$('stat').textContent=`累计 ${S.ok||0}/${S.done||0}`;$('bar').style.width=((S.done?S.ok/S.done:0)*100)+'%'}
function norm(s){return s.toLowerCase().replace(/[.,;!?()]/g,'').replace(/\s+/g,' ').trim()}function core(s){return norm(s.replace(/der\/die/g,'').replace(/\/in/g,'').replace(/\(mit\)/g,'').replace(/\.\.\./g,''))}
function pick(){let w=Object.keys(S.wrong||{}).map(Number);if(w.length&&Math.random()<.55)return w[Math.floor(Math.random()*w.length)];return Math.floor(Math.random()*DATA.length)}
function setMode(b){document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.m;nextQ()}
function nextQ(){locked=false;$('fb').textContent='';cur=pick();let x=DATA[cur],zh=mode[0]=='z';$('mt').textContent={zw:'看中文写德文',dw:'看德文写中文',zc:'看中文选德文',dc:'看德文选中文'}[mode];$('prompt').textContent=zh?x.zh:x.de;$('hint').textContent=zh?'请回忆对应的德语':'请写出 / 选出中文意思';$('write').style.display=mode[1]=='w'?'block':'none';$('choice').style.display=mode[1]=='c'?'block':'none';if(mode[1]=='w'){$('ans').value='';$('ans').focus()}else choices()}
function choices(){let x=DATA[cur],target=mode=='zc'?x.de:x.zh,set=new Set([target]);while(set.size<4){let r=DATA[Math.floor(Math.random()*DATA.length)];set.add(mode=='zc'?r.de:r.zh)}$('choices').innerHTML='';[...set].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>checkChoice(b,v,target);$('choices').appendChild(b)})}
function wrong(){let w=S.wrong[cur]||{n:0,s:0};w.n++;w.s=0;S.wrong[cur]=w;save()}function right(){if(S.wrong[cur]){S.wrong[cur].s=(S.wrong[cur].s||0)+1;if(S.wrong[cur].s>=2)delete S.wrong[cur]}save()}
function checkWrite(){if(locked)return;let x=DATA[cur],a=norm($('ans').value),ok=false;if(mode=='zw'){let t=[norm(x.de),core(x.de)];ok=t.includes(a)||t.some(q=>a.length>3&&(q.endsWith(' '+a)||a.endsWith(' '+q)))}else{let p=x.zh.split(/[；、，]/).map(norm);ok=p.some(q=>a==q||q.includes(a)||a.includes(q))}S.done++;if(ok){S.ok++;right();$('fb').className='feedback ok';$('fb').innerHTML='✓ 正确！ <button class="btn" onclick="speakNow()">🔊 听德语</button>';locked=true}else{wrong();$('fb').className='feedback bad';$('fb').textContent='✗ 还不对，再想一次；也可以点“看答案”。'}save()}
function checkChoice(b,v,t){if(locked)return;locked=true;S.done++;document.querySelectorAll('.choice').forEach(x=>{if(x.textContent==t)x.classList.add('good')});if(v==t){b.classList.add('good');S.ok++;right();$('fb').className='feedback ok';$('fb').textContent='✓ 正确！'}else{b.classList.add('no');wrong();$('fb').className='feedback bad';$('fb').textContent='✗ 已加入错题集'}save()}
function showAns(){if(locked)return;locked=true;wrong();let x=DATA[cur];$('fb').className='feedback bad';$('fb').innerHTML='答案：<b>'+(mode=='zw'?x.de:x.zh)+'</b> '+(mode=='zw'?'<button class="btn" onclick="speakNow()">🔊</button>':'')}
function ch(c){let a=$('ans'),s=a.selectionStart??a.value.length,e=a.selectionEnd??a.value.length;a.value=a.value.slice(0,s)+c+a.value.slice(e);a.focus();a.setSelectionRange(s+1,s+1)}
function clean(t){return t.replace(/der\/die/g,'').replace(/\/in/g,'').replace(/\(mit\)/g,'').replace(/,/g,' ').replace(/\s+/g,' ').trim()}function speakNow(){let t=DATA[cur].de;if(!('speechSynthesis'in window))return alert('当前浏览器不支持语音');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(clean(t));u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}
function mic(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('当前浏览器不支持语音输入，建议 Chrome/Edge');let r=new R();r.lang='de-DE';r.onresult=e=>{$('ans').value=e.results[0][0].transcript};r.start()}
function toggleWrong(){$('wrong').classList.toggle('show');renderWrong()}function renderWrong(){let ids=Object.keys(S.wrong||{}).map(Number);$('wl').innerHTML=ids.length?'':'<div class="muted" style="margin-top:12px">目前没有错题。</div>';ids.forEach(i=>{let x=DATA[i],w=S.wrong[i],d=document.createElement('div');d.className='wrongItem';d.innerHTML='<div class="top"><b>'+x.de+'</b><span class="grow"></span><button class="round" onclick="let old=cur;cur='+i+';speakNow();cur=old">🔊</button></div><div>'+x.zh+'</div><div class="muted">错误 '+(w.n||1)+' 次｜连续答对 '+(w.s||0)+'/2</div>';$('wl').appendChild(d)})}
function clearWrong(){if(confirm('确定清空错题集吗？')){S.wrong={};save();renderWrong()}}upd();nextQ();
</script></body></html>
