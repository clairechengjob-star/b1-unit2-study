<style>

<div class="app">
<header>
<h1>🎄 德语小白闯关乐园</h1>
<div class="sub">专为中国零基础学生：先听 → 再认 → 再说 → 最后造句</div>

<button class="tab active" data-tab="learn">① 听音认词</button>
<button class="tab" data-tab="quiz">② 中文选德语</button>
<button class="tab" data-tab="speak">③ 跟读模仿</button>
<button class="tab" data-tab="sentence">④ 拼句造句</button>
</div>

<section id="learn" class="panel active"><div class="card">
<div class="chapter" id="lchapter"></div><div class="word" id="lword"></div><div class="zh" id="lzh"></div>
<div class="note" id="lnote"></div>
<div class="btnrow"><button class="big primary speaker" onclick="speakDe(current.de)">🔊 听德语</button><button class="big ghost speaker" onclick="speakZh(current.zh)">🇨🇳 听中文</button></div>
<div class="btnrow"><button class="big ok" onclick="nextLearn()">我记住了 →</button></div>
<div class="small">建议：每个词至少听 3 遍，嘴巴跟着说。不要只用眼睛看。</div>
</div></section>

<section id="quiz" class="panel"><div class="card">
<div class="chapter">看到中文，点正确的德语</div><div class="zh" id="qzh"></div>
<div class="choicegrid" id="choices"></div>
<div class="answer" id="qanswer"></div>
<div class="btnrow"><button class="big primary" onclick="newQuiz()">下一题 →</button></div>
</div></section>

<section id="speak" class="panel"><div class="card">
<div class="chapter">先点播放，再大声模仿 3 遍</div><div class="word" id="sword"></div><div class="zh" id="szh"></div>
<div class="btnrow"><button class="big primary speaker" onclick="speakDe(speakItem.de)">🔊 慢速德语</button><button class="big ghost" onclick="slowRepeat()">🐢 超慢 × 3</button></div>
<div class="note">跟读口诀：<b>看词 → 听 → 停 → 模仿 → 再听</b><br>不要追求快，先追求嘴型和节奏。</div>
<div class="btnrow"><button class="big ok" onclick="nextSpeak()">我读完 3 遍 →</button></div>
</div></section>

<section id="sentence" class="panel"><div class="card">
<div class="chapter">把词块按正确顺序点出来</div>
<div class="word" id="targetWord"></div><div class="zh" id="targetZh"></div>
<div class="sentenceBox" id="sentenceZh"></div>
<div class="builder" id="builder"></div><div class="tokens" id="tokens"></div>
<div class="answer" id="sentAnswer"></div>
<div class="btnrow"><button class="big ghost" onclick="resetBuilder()">重来</button><button class="big primary" onclick="checkSentence()">检查句子</button><button class="big ok" onclick="newSentence()">下一句 →</button></div>
</div></section>
</div>

let score=0, streak=0, seen=new Set(), learnIndex=0, current=vocab[0], speakItem=vocab[0], sentenceItem=null, answerTokens=[];
function updateStats(){
 document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;
 document.getElementById('seen').textContent=seen.size;document.getElementById('progress').style.width=Math.min(100,seen.size/vocab.length*100)+'%';
}
function speak(text,lang,rate=.78){
 if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音合成，请用 Safari 打开。');return}
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=1;
 const voices=speechSynthesis.getVoices(); const v=voices.find(x=>x.lang.toLowerCase().startsWith(lang.toLowerCase().slice(0,2))); if(v)u.voice=v;
 speechSynthesis.speak(u);
}
const cleanDe=s=>s.replace(/der\/die/g,'der oder die').replace(/…/g,'');
function speakDe(t){speak(cleanDe(t),'de-DE',.68)} function speakZh(t){speak(t,'zh-CN',.85)}
function renderLearn(){
 current=vocab[learnIndex%vocab.length];document.getElementById('lchapter').textContent=current.chapter;
 document.getElementById('lword').textContent=current.de;document.getElementById('lzh').textContent=current.zh;document.getElementById('lnote').textContent='🧠 '+current.note;
 setTimeout(()=>speakDe(current.de),250);
}
function nextLearn(){seen.add(current.de);score+=2;learnIndex++;updateStats();renderLearn()}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function newQuiz(){
 const correct=vocab[Math.floor(Math.random()*vocab.length)];
 const others=shuffled(vocab.filter(x=>x.de!==correct.de)).slice(0,3);
 document.getElementById('qzh').textContent=correct.zh;
 const box=document.getElementById('choices');box.innerHTML='';document.getElementById('qanswer').className='answer';
 shuffled([correct,...others]).forEach(x=>{
   const b=document.createElement('button');b.className='choice';b.textContent=x.de;
   b.onclick=()=>{if(x.de===correct.de){b.classList.add('correct');score+=5;streak++;seen.add(correct.de);speakDe(correct.de);
     document.getElementById('qanswer').innerHTML='✅ '+correct.de+'<br><span class="small">记忆钩子：'+correct.note+'</span>';
   }else{b.classList.add('wrong');streak=0;score=Math.max(0,score-1)} document.getElementById('qanswer').classList.add('show');updateStats();};
   box.appendChild(b);
 });
}
function renderSpeak(){document.getElementById('sword').textContent=speakItem.de;document.getElementById('szh').textContent=speakItem.zh}
function nextSpeak(){seen.add(speakItem.de);score+=3;speakItem=vocab[Math.floor(Math.random()*vocab.length)];renderSpeak();updateStats()}
function slowRepeat(){let n=0;function go(){if(n++>=3)return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanDe(speakItem.de));u.lang='de-DE';u.rate=.52;u.onend=()=>setTimeout(go,450);speechSynthesis.speak(u)}go()}
function newSentence(){
 const list=vocab.filter(x=>x.sentence);sentenceItem=list[Math.floor(Math.random()*list.length)];
 document.getElementById('targetWord').textContent=sentenceItem.de;document.getElementById('targetZh').textContent=sentenceItem.zh;
 document.getElementById('sentenceZh').textContent='🇨🇳 '+sentenceItem.sentenceZh;
 answerTokens=sentenceItem.sentence.replace(/[.!?]/g,'').split(/\s+/); resetBuilder();
}
function resetBuilder(){
 document.getElementById('builder').innerHTML='';const tok=document.getElementById('tokens');tok.innerHTML='';document.getElementById('sentAnswer').className='answer';
 shuffled(answerTokens).forEach((t,i)=>{const b=document.createElement('button');b.className='token';b.textContent=t;b.onclick=()=>{document.getElementById('builder').appendChild(b)};tok.appendChild(b)});
}
function checkSentence(){
 const built=[...document.getElementById('builder').children].map(x=>x.textContent).join(' ');
 const ok=built===answerTokens.join(' ');const a=document.getElementById('sentAnswer');a.className='answer show';
 if(ok){a.innerHTML='✅ 太棒了！<br><b>'+sentenceItem.sentence+'</b>';score+=8;streak++;seen.add(sentenceItem.de);speakDe(sentenceItem.sentence)}
 else{a.innerHTML='❌ 再试一次。正确句子：<br><b>'+sentenceItem.sentence+'</b>';streak=0;speakDe(sentenceItem.sentence)}
 updateStats();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')})
speechSynthesis.onvoiceschanged=()=>{};
renderLearn();newQuiz();renderSpeak();newSentence();updateStats();
</script>
